version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: disaster_command_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-command_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-command_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-disaster_command_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-command_admin} -d ${POSTGRES_DB:-disaster_command_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disaster_command_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-command_admin}:${POSTGRES_PASSWORD:-command_secure_password}@postgres:5432/${POSTGRES_DB:-disaster_command_db}
      - IS_SIMULATION_MODE=true
      - EMERGENCY_SERVICES_INTEGRATED=false
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:-default-insecure-key-change-in-prod}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disaster_command_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
